# main ブランチに push したら、自動でビルドして GitHub Pages に公開する。
#
# 【料金について】
# パブリックリポジトリなら、GitHub Actions の実行時間も Pages の公開も無料。
# プライベートリポジトリで Pages を使うには有料プランが必要なので、
# 無料で運用するならリポジトリは Public にすること。
# (アプリのコードが公開されるだけで、入力した時間割データは
#  自分のiPhoneの中にしか無いので外からは見えない)
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  # 「Actions」タブから手動でも実行できるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする(古いほうは打ち切る)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json のとおりに入れる(npm install より確実で速い)
      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
